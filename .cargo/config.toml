[alias]
xtask = "run --package xtask --"

# Tinta Office: this fork's builds are "Tinta Texto" (see crates/brand). The ArtCraft
# marks may not be used by redistributed builds (docs/brand/LICENSE-brand.txt).
[env]
WORDCRAFT_BRAND_NAME = "Tinta Texto"
WORDCRAFT_BRAND_SLUG = "tinta-texto"
WORDCRAFT_BRAND_APP_ID = "io.github.stdenis1980.tintatexto"
WORDCRAFT_BRAND_PUBLISHER = "Tinta Office"
WORDCRAFT_BRAND_WEBSITE = "https://github.com/StDenis1980/wordcraft"
WORDCRAFT_BRAND_GITHUB = "https://github.com/StDenis1980/wordcraft"
# Tinta Office: where error reports go once the person allowed them (apps/wordcraft/src/tinta_report.rs).
TINTA_REPORT_URL = "https://report.tintaoffice.com"
