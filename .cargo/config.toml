[alias]
xtask = "run --package xtask --"

# IberOffice: this fork's builds are "Iber Texto" (see crates/brand). The ArtCraft
# marks may not be used by redistributed builds (docs/brand/LICENSE-brand.txt).
[env]
WORDCRAFT_BRAND_NAME = "Iber Texto"
WORDCRAFT_BRAND_SLUG = "iber-texto"
WORDCRAFT_BRAND_APP_ID = "io.github.stdenis1980.ibertexto"
WORDCRAFT_BRAND_PUBLISHER = "IberOffice"
WORDCRAFT_BRAND_WEBSITE = "https://github.com/StDenis1980/wordcraft"
WORDCRAFT_BRAND_GITHUB = "https://github.com/StDenis1980/wordcraft"
